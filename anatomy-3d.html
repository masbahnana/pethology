<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Anatomy — Pethology</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; background: #f7f6f3; }

    #viewer-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Auth gate — shown while checking session */
    #auth-gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f6f3;
      z-index: 100;
    }

    #auth-gate.hidden { display: none; }
  </style>
</head>
<body>

  <!-- Shown until auth check passes -->
  <div id="auth-gate">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2383E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
      <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
      <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
    </svg>
  </div>

  <iframe id="viewer-frame" src="anatomy-viewer/index.html" title="3D Anatomy Viewer" allowfullscreen></iframe>

  <script>
    (function () {
      const raw = sessionStorage.getItem('pethologyUser');

      if (!raw) {
        window.location.href = 'auth0-login.html';
        return;
      }

      try {
        const user = JSON.parse(raw);
        if (!user || !user.id) throw new Error('invalid session');
      } catch (_) {
        sessionStorage.removeItem('pethologyUser');
        window.location.href = 'auth0-login.html';
        return;
      }

      // Session valid — show viewer
      document.getElementById('auth-gate').classList.add('hidden');
    })();
  </script>

</body>
</html>
